name: CPT JohnG entry alerts

# Runs in GitHub's cloud - no laptop needed. Every 15 min during US market hours.
# GitHub cron is UTC and does NOT adjust for daylight saving. This window covers both
# EDT (Mar-Nov, market = 13:30-20:00 UTC) and EST (Nov-Mar, market = 14:30-21:00 UTC).
# The script itself guards to real market hours, so off-hours runs simply do nothing.
on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'   # every 15 min, Mon-Fri, ~US market hours (UTC)
  workflow_dispatch:               # run manually from the Actions tab
    inputs:
      preview:
        description: 'Ticker for a one-off TEST alert (e.g. TQQQ). Leave blank for a normal scan.'
        required: false
        default: ''

permissions:
  contents: write                 # needed to save the fire-once state back to the repo

concurrency:                      # never let two runs overlap
  group: cpt-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan for JohnG entries and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREVIEW: ${{ github.event.inputs.preview }}
        run: |
          if [ -n "$PREVIEW" ]; then
            echo "Sending one-off TEST alert for $PREVIEW (from the cloud runner)"
            python cpt_telegram_alerts.py --preview "$PREVIEW"
          else
            python cpt_telegram_alerts.py
          fi
      - name: Persist fire-once state (only if it changed)
        run: |
          if [ -n "$(git status --porcelain .telegram_alert_state.json)" ]; then
            git config user.name "cpt-alert-bot"
            git config user.email "cpt-alert-bot@users.noreply.github.com"
            git add .telegram_alert_state.json
            git commit -m "update alert state [skip ci]"
            git push
          else
            echo "no state change"
          fi
